<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Effect on Titles</title>

    <style>
        h1{
            color: blue;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-display: block;
            font-style: italic;



        }
        p{
            color: rgb(255, 127, 127);
            font-family: Georgia, 'Times New Roman', Times, serif;
            font-display: fallback;
            font-style: oblique;
        }
    </style>
</head>
<body>
    
    <h1>
      fhj vhdfhgohse
    </h1>
    <p>
        oufbuseUfiobes fn cvdsn vnds vbhbgbe1234567890098765432fdv ug eyaj fsfvbw68ae7agadygwa6gdyaw
    </p>
    
</body>
</html>
