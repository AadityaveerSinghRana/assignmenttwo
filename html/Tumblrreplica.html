<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

<style>
body{
    background-color: rgb(26, 26, 79);
}


header{
    width: 220px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: sticky;
    top: 20px;
    height: fit-content;
}

main{
  width: 540px; /* Standard feed width */
    display: flex;
    flex-direction: column;
    gap: 20px;
}

footer{
    width: 300px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    position: sticky;
    top: 20px;
    height: fit-content;
                   
}
</style>


</head>
<body>
    <header class="TumblrHeader">
        <h1>Tumblr</h1>
        <ul type="none">
            <li>Explore</li>
            <li>Communities</li>
            <li>Change Palette</li>
        </ul>
        <div class="authBtn">
            <button class="bluebtn">Sign Up</button><br>
            <button class="blackbtn">Log in</button>
        </div>
    </header>
    <main>
        <section class="navmenuContainer">
            <nav>
                <a>Trending</a>
                <a>Staff Picks</a>
                <a>Videos</a>
                <a>More</a>
            </nav>
            <div class="tileContainer">
                <img>
                <img>
            </div>
        </section>
    </main>
    <footer>
        <div class="SearchBtn">
                <input type="text" placeholder="Search Tumblr">
            </div>
            <div class="trendingContainer">
                <h4>Trending Blogs</h4>
                <hr>
                <div class="blogSuggestion">
                    <ul>
                        <li class="contentContainer">
                            <img>
                            <div class="textContent">
                                <h5>Holemusic</h5>
                                <span>Hole</span>
                            </div>
                            <a>Follow</a>
                            <a>x</a>
                        </li>
                    </ul>
                </div>
            </div>
    </footer>
    
</body>
</html>
